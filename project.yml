name: ForexFactoryMVP
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ForexFactoryMVP:
    type: application
    platform: iOS
    sources: [ForexFactoryMVP]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: shop.zhenmei.ForexFactoryMVP
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7GD7XPGQ4K
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: Security.framework
  ForexFactoryMVPTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ForexFactoryMVPTests]
    dependencies:
      - target: ForexFactoryMVP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ForexFactoryMVP:
    build:
      targets:
        ForexFactoryMVP: all
        ForexFactoryMVPTests: [test]
    test:
      targets: [ForexFactoryMVPTests]
